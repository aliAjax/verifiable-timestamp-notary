<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timestamp Notary Console</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f4f7fb; color: #1d2939; }
    main { max-width: 760px; margin: 8vh auto; padding: 32px; background: white; border: 1px solid #d0d5dd; border-radius: 8px; }
    h1 { margin-top: 0; }
    .status { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: #ecfdf3; color: #067647; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    code { background: #f2f4f7; padding: 2px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Timestamp Notary</h1>
    <p class="status"><span class="dot"></span><span id="status">checking service</span></p>
    <p>Submit a digest to the REST API and inspect its proof and audit chain.</p>
    <p>Health endpoint: <code>/healthz</code></p>
  </main>
  <script>
    fetch('/healthz').then(r => r.ok ? 'service ready' : 'service unavailable')
      .catch(() => 'service unavailable')
      .then(v => { document.getElementById('status').textContent = v; });
  </script>
</body>
</html>
